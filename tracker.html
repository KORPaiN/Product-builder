<html lang="ko">

    <title>내 트래커 - 습관 디자인 코치</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .habit-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .habit-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--primary-color);
        }
        .habit-streak {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 152, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .habit-level-info {
            background: var(--input-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        .action-row {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .checkin-btn {
            background: linear-gradient(135deg, var(--primary-color), #2E7D32);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        .checkin-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .levelup-btn {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        /* 캘린더 히트맵(잔디 심기) 스타일 */
        .heatmap-container {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: rgba(0,0,0,0.03);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        .heatmap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
        }
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        @media (min-width: 480px) {
            .heatmap-grid { grid-template-columns: repeat(14, 1fr); }
        }
        @media (min-width: 768px) {
            .heatmap-grid { grid-template-columns: repeat(28, 1fr); }
        }
        .heatmap-day {
            aspect-ratio: 1;
            border-radius: 4px;
            background: rgba(0,0,0,0.08);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .heatmap-day:hover { transform: scale(1.2); z-index: 2; }
        .heatmap-day.checked {
            background: var(--primary-color);
        }
        .dark-theme .heatmap-day {
            background: rgba(255,255,255,0.1);
        }
        .dark-theme .heatmap-day.checked {
            background: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
        }
        .heatmap-tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            display: none;
            white-space: nowrap;
            pointer-events: none;
        }
        .heatmap-day:hover .heatmap-tooltip { display: block; }

        /* 카드 상단 액션(편집/삭제) */
        .card-top-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-bottom: -1rem;
            z-index: 5;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            transition: color 0.2s, transform 0.2s;
        }
        .icon-btn:hover { color: var(--primary-color); transform: scale(1.1); }
        .icon-btn.delete-btn:hover { color: #f44336; }

        /* 편집 모드 입력창 */
        .edit-input {
            width: 100%;
            padding: 0.6rem;
            margin: 0.3rem 0;
            border-radius: 8px;
            border: 1px solid var(--primary-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
        }
        .save-edit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:0.5rem;">
                    <i class="fas fa-seedling"></i> 습관 디자인 코치
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="tracker.html" style="color: var(--primary-color);">내 트래커</a></li>
                    <li><a href="contact.html">문의</a></li>
                </ul>
            </nav>
            <div class="auth-container" style="display: flex; gap: 1rem; align-items: center;">
                <div id="user-profile" style="display: flex; gap: 0.5rem; align-items: center; font-size:0.9rem;">
                    <span id="user-name" style="font-weight:700;">로딩중...</span>
                    <button id="logout-btn" class="glass-btn small-btn" style="background: rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:0.3rem 0.6rem; cursor:pointer; font-size:0.8rem;">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="tracker-dashboard">
            <h1 style="text-align: center; margin-bottom: 0.5rem; font-weight: 800; font-size: 2.5rem; background: -webkit-linear-gradient(45deg, var(--primary-color), #2196F3); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">내 습관 트래커 🔥</h1>
            <p class="intro-text" style="text-align: center; margin-bottom: 3rem;">꾸준히 실천하며 단계별로 레벨업해 보세요!</p>
            
            <div id="habits-list">
                <div id="loading-habits" style="text-align:center; padding: 3rem; font-size: 1.2rem; color: var(--text-muted);">
                    <i class="fas fa-spinner fa-spin"></i> 내 습관을 불러오는 중...
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 습관 디자인 코치. 당신의 작은 성취를 응원합니다.</p>
        </div>
    </footer>

    <script src="tracker.js"></script>
</body>
</html>
