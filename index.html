<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPKJ12J38W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vfot8jev78");

    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>습관 디자인 코치 - 작은 성취의 힘</title>
    <meta name="description" content="작은 행동을 아주 쉬운 습관으로 디자인하여 당신의 큰 목표를 이룰 수 있도록 도와드립니다.">

    <link rel="stylesheet" href="style.css">
    <!-- Pretendard Web Component -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6263172518351849" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-6263172518351849">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:0.5rem;">
                    <i class="fas fa-seedling"></i> 습관 디자인 코치
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="tracker.html" id="nav-tracker-link" class="hidden">내 트래커</a></li>
                    <li><a href="contact.html">문의</a></li>
                </ul>
            </nav>
            <div class="auth-container" style="display: flex; gap: 1rem; align-items: center;">
                <button id="login-btn" class="glass-btn small-btn" style="background: rgba(255,255,255,0.7); border:1px solid rgba(255,255,255,0.4); border-radius:12px; padding:0.5rem 1rem; cursor:pointer; font-weight:600;"><i class="fab fa-google"></i> 로그인</button>
                <div id="user-profile" class="hidden" style="display: flex; gap: 0.5rem; align-items: center; font-size:0.9rem;">
                    <span id="user-name" style="font-weight:700;"></span>
                    <button id="logout-btn" class="glass-btn small-btn" style="background: rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:0.3rem 0.6rem; cursor:pointer; font-size:0.8rem;">로그아웃</button>
                </div>
                <button id="theme-toggle-btn">다크 모드</button>
            </div>
        </div>
    </header>

    <main class="container">
        
        <section id="hero">
            <h1>작은 습관이 큰 변화를 만듭니다</h1>
            <p class="intro-text">
                당신의 원대한 목표를 '너무 쉬워서 안 하기가 더 어려운' 아주 작은 행동으로 쪼개어 실천해보세요.
            </p>
            
            <div class="example-cards">
                <div class="example-card" onclick="document.getElementById('goal-input').value='매일 아침 운동하기'">
                    <i class="fas fa-dumbbell"></i>
                    <span>매일 아침 운동</span>
                </div>
                <div class="example-card" onclick="document.getElementById('goal-input').value='올해 책 50권 읽기'">
                    <i class="fas fa-book-open"></i>
                    <span>책 50권 읽기</span>
                </div>
                <div class="example-card" onclick="document.getElementById('goal-input').value='물 하루에 2L 마시기'">
                    <i class="fas fa-glass-water"></i>
                    <span>물 2L 마시기</span>
                </div>
                <div class="example-card" onclick="document.getElementById('goal-input').value='매일 영어 10문장 외우기'">
                    <i class="fas fa-language"></i>
                    <span>영어 10문장 외우기</span>
                </div>
            </div>
        </section>

        <section class="habit-designer">
            <div class="input-card">
                <h2>당신의 큰 목표는 무엇인가요?</h2>
                <div class="input-group">
                    <input type="text" id="goal-input" placeholder="예: 매일 아침 운동하기, 책 50권 읽기...">
                    <button id="design-habit-btn">습관 디자인하기</button>
                </div>
            </div>

            <div id="loading-spinner" class="hidden">
                <i class="fas fa-spinner fa-spin"></i> 습관을 디자인 중입니다...
            </div>

            <div id="result-container" class="hidden">
                <div class="result-card">
                    <h3>나의 작은 습관 레시피</h3>
                    <div class="habit-recipe">
                        <div class="recipe-item">
                            <span class="label">앵커 (기존 루틴 뒤에)</span>
                            <p id="anchor-text"></p>
                        </div>
                        <div class="recipe-item">
                            <span class="label">작은 행동 (30-120초)</span>
                            <p id="tiny-action-text"></p>
                        </div>
                        <div class="recipe-item">
                            <span class="label">축하 (즉시, 짧게)</span>
                            <p id="celebration-text"></p>
                        </div>
                    </div>
                </div>

                <div class="ladder-card">
                    <h3>단계별 성장 사다리</h3>
                    <ul id="difficulty-ladder">
                        <!-- Ladder items will be injected here -->
                    </ul>
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <div style="margin-bottom: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 0.75rem;">
                        <label for="start-level" style="font-weight: 700; color: var(--text-color); font-size: 1.05rem;">이 습관의 시작 난이도 선택:</label>
                        <select id="start-level" style="padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-color); font-family: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;">
                            <option value="1">Lv.1 (초소형 행동) - 추천!</option>
                            <option value="0">Lv.0 (환경 설정만 하기)</option>
                            <option value="2">Lv.2 (조금 늘린 행동)</option>
                            <option value="3">Lv.3 (기본 중간 단계)</option>
                            <option value="4">Lv.4</option>
                            <option value="5">Lv.5</option>
                            <option value="6">Lv.6 (최종 목표)</option>
                        </select>
                    </div>

                    <button id="save-habit-btn" class="glass-btn" style="background: linear-gradient(135deg, var(--primary-color), #2E7D32); color: white; border: none; border-radius: 16px; padding: 1rem 2rem; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 8px 15px rgba(76, 175, 80, 0.25);">
                        <i class="fas fa-save"></i> 이 습관 내 계정에 저장하고 시작하기
                    </button>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 습관 디자인 코치. 당신의 작은 성취를 응원합니다.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
