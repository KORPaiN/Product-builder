
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle-btn">Toggle Theme</button>
        <h1>Lotto Number Generator</h1>
        <div id="lotto-container"></div>
        <button id="generate-btn">Generate Numbers</button>

        <div class="partnership-form">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/xlggrpwn" method="POST">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="_replyto" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <input type="text" name="company" placeholder="Company / Organization">
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="How can we partner together?" required></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
